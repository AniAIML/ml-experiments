name: Weather detection

on:
  schedule:
    - cron: "30 0,6,12 * * *"   # 06:00, 12:00, 18:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weather-detection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: weather-detection/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run weather detector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weather_detector.py --config rain_prediction.yml
      - name: Commit results
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather-detection/results weather-detection/data
          git diff --cached --quiet || (git commit -m "Update weather results" && git push)
